<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геометричні примітиви</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Геометричні примітиви</h1>
    <div class="controls">

        <div class="panel">
            <button class="toggle-circle">Коло</button>
            <p>Висота</p>
            <div class="buttons">
                <button class="circle-up">+</button>
                <button class="circle-down">-</button>
            </div>
            <p>Ширина</p>
            <div class="buttons">
                <button class="circle-right">+</button>
                <button class="circle-left">-</button>
            </div>
        </div>

        <div class="panel">
            <button class="toggle-rectangle">Прямокутник</button>
            <p>Висота</p>
            <div class="buttons">
                <button class="rectangle-up">+</button>
                <button class="rectangle-down">-</button>
            </div>
            <p>Ширина</p>
            <div class="buttons">
                <button class="rectangle-right">+</button>
                <button class="rectangle-left">-</button>
            </div>
        </div>

        <div class="panel">
            <button class="toggle-triangle">Трикутник</button>
            <p>Висота</p>
            <div class="buttons">
                <button class="triangle-up">+</button>
                <button class="triangle-down">-</button>
            </div>
            <p>Ширина</p>
            <div class="buttons">
                <button class="triangle-right">+</button>
                <button class="triangle-left">-</button>
            </div>
        </div>

    </div>
    <div class="canvas" id="canvas"></div>
    <script type="module" src="script.js"></script>
</body>
</html>
